name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Application checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `npm install` — the lockfile is the contract, and a build
      # that silently resolves different versions is not the build we reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  boundaries:
    name: Milestone boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These mirror the constraints on this milestone. They are cheap, and they
      # fail loudly if a later change crosses a line that was meant to hold.
      # Roadmap PR 3 authorizes migrations, but only in one place. The frontend
      # still has no database access, so a migration inside `app/` would be a
      # migration the application could reach.
      #
      # SQL is allowed under db/ (the executable migrations) and schemas/ (the
      # v0.1.0 design baseline), plus ONE allowlisted design document by exact
      # path. A blanket docs/ exemption is not used: docs/ is a directory a
      # migration could quietly be added to, and the point of this check is that
      # migrations cannot appear anywhere except db/.
      - name: Migrations live only in db/migrations
        run: |
          allowed='docs/design/11_SCHEMA_DELTA_PROPOSAL.sql'

          # An allowlist entry that no longer names a real file is a permanent
          # hole nobody notices, so the entry has to keep earning its place.
          if [ ! -f "$allowed" ]; then
            echo "Allowlisted file $allowed no longer exists. Remove it from the allowlist."
            exit 1
          fi

          stray=$(git ls-files '*.sql' \
                  | grep -vE '^(db|schemas)/' \
                  | grep -vxF "$allowed" || true)
          if [ -n "$stray" ]; then
            echo "SQL outside db/ and schemas/, and not the allowlisted design proposal:"
            echo "$stray"
            exit 1
          fi
          if git ls-files 'app/**' | grep -Ei 'migration|\.sql$'; then
            echo "The application tree must contain no migrations."
            exit 1
          fi

      # DDL only. A migration that carries rows is a data operation wearing a
      # migration's clothes, and it runs on every environment including
      # production without anyone deciding that it should.
      - name: Migrations insert no data
        run: |
          if grep -rniE '^[[:space:]]*(insert|copy|update|delete)[[:space:]]' db/migrations/; then
            echo "A migration writes rows. Migrations in this repository are DDL only."
            exit 1
          fi

      - name: Personal-data structures stay dormant
        run: |
          if grep -rn 'contact_records' db/migrations/ \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*--'; then
            echo "contact_records must not be created. See D14-L and 10_DESIGN_RESPONSE.md §6.5."
            exit 1
          fi

      # The same real-name boundary the application test enforces, applied to the
      # database tree. Structural fixtures are all "Example ...".
      #
      # Case-SENSITIVE, matching the application test. Case-insensitively,
      # "Nestl" matches inside the ordinary English word "honestly".
      - name: The database tree names no real pilot account or event
        run: |
          names='Nestl|PepsiCo|Coca-Cola|Anheuser|Tyson|Kraft|Conagra|General Mills'
          names="$names|Unilever|Danone|Niagara|Sherwin|Mondelez|Keurig|Hormel|Smithfield|PACK EXPO"
          if grep -rnE "$names" db/; then
            echo "A real pilot account or event name appears in the database tree."
            exit 1
          fi

      - name: No environment or secret files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|id_rsa'; then
            echo "A credential-shaped file is tracked in git."
            exit 1
          fi

      - name: Netlify configuration is present and points at the app
        run: |
          grep -q 'base = "app"' netlify.toml
          grep -q 'publish = "dist"' netlify.toml
          grep -q 'status = 200' netlify.toml
          test -f app/public/_redirects

  database:
    name: Migration checks (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest

    # 16 AND 17. Supabase provisions 17 for new projects, so 17 is the version
    # the migrations will actually meet; 16 stays in the matrix because the
    # schema was authored and reviewed against it and a silent divergence
    # between the two is exactly what this leg is here to catch.
    #
    # fail-fast is off: when one version breaks, the other version's result is
    # the most useful diagnostic available, and cancelling it throws that away.
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']

    # No Supabase project is contacted and no production credential is required:
    # the service container is created, migrated, tested and destroyed inside
    # the job.
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: radar
      PGPASSWORD: radar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The migration harness shells out to psql, so the client has to match the
      # server major version. The runner image ships an older client by default.
      - name: Install the PostgreSQL ${{ matrix.pg }} client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"

      # Verified, not assumed. The design package explicitly refuses to assume a
      # PostgreSQL major version, and pgcrypto is a hard dependency of the
      # baseline schema's `gen_random_uuid()` defaults.
      #
      # The server major is asserted against the matrix leg. Without this, a
      # mis-tagged image would let one version's result be reported under the
      # other version's name — the matrix would look green and prove nothing.
      - name: Verify the server version and pgcrypto availability
        run: |
          psql -d postgres -tAc 'select version();'
          server_major=$(psql -d postgres -tAc 'show server_version;' | cut -d. -f1)
          if [ "$server_major" != "${{ matrix.pg }}" ]; then
            echo "Expected PostgreSQL ${{ matrix.pg }}, the server reports $server_major."
            exit 1
          fi
          client_major=$(psql --version | grep -oE '[0-9]+' | head -1)
          if [ "$client_major" != "${{ matrix.pg }}" ]; then
            echo "psql client is $client_major, expected ${{ matrix.pg }}."
            exit 1
          fi
          psql -d postgres -tAc "select 1 from pg_available_extensions where name = 'pgcrypto';" \
            | grep -q 1 || { echo 'pgcrypto is not available on this server.'; exit 1; }

      # Empty -> forward -> rollback; v0.1.0 -> forward -> rollback to baseline,
      # compared dump for dump; positive and negative schema-contract tests; and
      # a deliberate migration edit that must be caught by checksum verification.
      - name: Migration contract
        run: bash db/verify.sh
