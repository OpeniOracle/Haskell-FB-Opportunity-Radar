name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be re-triggered without an empty commit — useful when a delivery
  # is delayed, or when re-running against an unchanged tree is the point.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Application checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `npm install` — the lockfile is the contract, and a build
      # that silently resolves different versions is not the build we reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  boundaries:
    name: Milestone boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These mirror the constraints on this milestone. They are cheap, and they
      # fail loudly if a later change crosses a line that was meant to hold.
      # Roadmap PR 3 authorizes migrations, but only in one place. The frontend
      # still has no database access, so a migration inside `app/` would be a
      # migration the application could reach.
      #
      # SQL is allowed under db/ (the executable migrations) and schemas/ (the
      # v0.1.0 design baseline), plus ONE allowlisted design document by exact
      # path. A blanket docs/ exemption is not used: docs/ is a directory a
      # migration could quietly be added to, and the point of this check is that
      # migrations cannot appear anywhere except db/.
      - name: Migrations live only in db/migrations
        run: |
          allowed='docs/design/11_SCHEMA_DELTA_PROPOSAL.sql'

          # An allowlist entry that no longer names a real file is a permanent
          # hole nobody notices, so the entry has to keep earning its place.
          if [ ! -f "$allowed" ]; then
            echo "Allowlisted file $allowed no longer exists. Remove it from the allowlist."
            exit 1
          fi

          stray=$(git ls-files '*.sql' \
                  | grep -vE '^(db|schemas)/' \
                  | grep -vxF "$allowed" || true)
          if [ -n "$stray" ]; then
            echo "SQL outside db/ and schemas/, and not the allowlisted design proposal:"
            echo "$stray"
            exit 1
          fi
          if git ls-files 'app/**' | grep -Ei 'migration|\.sql$'; then
            echo "The application tree must contain no migrations."
            exit 1
          fi

      # DDL only. A migration that carries rows is a data operation wearing a
      # migration's clothes, and it runs on every environment including
      # production without anyone deciding that it should.
      - name: Migrations insert no data
        run: |
          if grep -rniE '^[[:space:]]*(insert|copy|update|delete)[[:space:]]' db/migrations/; then
            echo "A migration writes rows. Migrations in this repository are DDL only."
            exit 1
          fi

      - name: Personal-data structures stay dormant
        run: |
          if grep -rn 'contact_records' db/migrations/ \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*--'; then
            echo "contact_records must not be created. See D14-L and 10_DESIGN_RESPONSE.md §6.5."
            exit 1
          fi

      # The D14-L trade show must never be named in anything that RUNS —
      # application source, server functions, migrations or seeds. The design
      # documentation names it constantly and correctly: D14-L is a decision the
      # package exists to explain, and scrubbing the explanation would hide the
      # constraint rather than enforce it. So this checks executable trees only.
      #
      # Case-SENSITIVE throughout these checks. Case-insensitively, "Nestl"
      # matches inside the ordinary English word "honestly", which is how an
      # earlier version of the account check failed on its own prose.
      - name: The blocked trade show is never named in executable code
        run: |
          if grep -rn 'PACK EXPO' app/src app/netlify db \
               --exclude=boundaries.test.ts; then
            echo "The D14-L trade show is named in code that runs."
            exit 1
          fi

      # Real pilot accounts are legitimate in db/seed — that is the whole point
      # of seeding the cohort through the database layer rather than as
      # application fixtures. They are NOT legitimate in a migration (schema is
      # not data) or in a structural test fixture (which uses "Example ..."),
      # and `app/src/test/boundaries.test.ts` keeps them out of the bundle.
      - name: Migrations and test fixtures name no real pilot account
        run: |
          names='Nestl|PepsiCo|Coca-Cola|Anheuser|Tyson|Kraft|Conagra|General Mills'
          names="$names|Unilever|Danone|Niagara|Sherwin|Mondelez|Keurig|Hormel|Smithfield"
          if grep -rnE "$names" db/migrations/ db/tests/; then
            echo "A real pilot account appears in a migration or a test fixture."
            echo "Seed data belongs in db/seed/."
            exit 1
          fi

      # The cohort is seeded through the database layer, never compiled into the
      # browser bundle as a fixture.
      - name: The pilot cohort is seeded, not hard-coded in the application
        run: |
          if [ ! -f db/seed/0003_pilot_cohort.sql ]; then
            echo "The pilot cohort seed is missing."
            exit 1
          fi
          if grep -rn 'highest_value' app/src/data/fixtures/ 2>/dev/null; then
            echo "Cohort data appears in application fixtures."
            exit 1
          fi

      - name: No environment or secret files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|id_rsa'; then
            echo "A credential-shaped file is tracked in git."
            exit 1
          fi

      # Secret-leak detection across every tracked file.
      #
      # The publishable key is deliberately NOT in this list: it is not
      # confidential, it is committed in netlify.toml on purpose, and treating it
      # as a secret would train everyone to ignore this check.
      - name: No secret is committed anywhere in the repository
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{8,}' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)app/src/test/*'; then
            echo "A Supabase SECRET key is committed."
            exit 1
          fi
          if git grep -nE 'postgres(ql)?://[^[:space:]"'"'"']+' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)docs/**'; then
            echo "A database connection string is committed."
            exit 1
          fi
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- .; then
            echo "A private key is committed."
            exit 1
          fi
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{16,}' -- .; then
            echo "An Anthropic API key is committed."
            exit 1
          fi

      # The legacy Supabase key pair must not come back. It rotates as one unit
      # — rotating the service key invalidates the anon key and signs everyone
      # out — and the two are indistinguishable by shape, so a paste error puts a
      # full-database key in the browser bundle with nothing to catch it.
      - name: The legacy anon / service_role key pair is not configured
        run: |
          if git grep -nE '(VITE_)?SUPABASE_(ANON|SERVICE_ROLE)_KEY' \
               -- . ':(exclude).github/workflows/ci.yml' \
                    ':(exclude)app/netlify/functions/_shared/env.ts' \
                    ':(exclude)app/src/test/boundaries.test.ts' \
                    ':(exclude)docs/ENVIRONMENT.md'; then
            echo "The legacy Supabase key names are referenced outside the code that forbids them."
            exit 1
          fi
          # The secret key must never acquire a VITE_ prefix. This file is
          # excluded for the same reason the others are: it necessarily contains
          # the string it forbids.
          if git grep -nE 'VITE_SUPABASE_SECRET_KEY' \
               -- . ':(exclude).github/workflows/ci.yml' \
                    ':(exclude)app/netlify/functions/_shared/env.ts' \
                    ':(exclude)app/src/test/boundaries.test.ts'; then
            echo "The Supabase secret key is exposed to the browser bundle."
            exit 1
          fi

      # Confidential evidence is served by an authenticated same-origin proxy,
      # never by a signed Storage URL. A signed URL is a bearer credential that
      # outlives removal from the allowlist, and a cached response outlives even
      # the token.
      - name: Evidence is not served by signed Storage URLs
        run: |
          if git grep -nE 'createSignedUrl|getPublicUrl' -- app/ ':(exclude)app/src/test/*'; then
            echo "A signed or public Storage URL is generated. Use /api/evidence/:id."
            exit 1
          fi
          test -f app/netlify/functions/evidence.ts
          grep -q "private, no-store" app/netlify/functions/evidence.ts

      # A valid Supabase access token outlives sign-out: it stays
      # cryptographically valid until its own `exp` even after the session is
      # revoked. The evidence proxy therefore checks `auth.sessions` on every
      # request, which is the only reason its refusal is immediate. Losing that
      # would restore the exact property the proxy exists to remove, silently.
      - name: The evidence proxy checks the session table, not just the token
        run: |
          test -f db/migrations/0018_evidence_session_guard.up.sql
          grep -q 'requireLiveSession' app/netlify/functions/evidence.ts
          grep -q 'authorize_evidence_access' app/netlify/functions/_shared/sessionGuard.ts
          # Boolean only, service_role only. A function that returned rows, or
          # that anyone could execute, would leak other users' sessions.
          grep -qE 'returns[[:space:]]+boolean' db/migrations/0018_evidence_session_guard.up.sql
          for role in public anon authenticated; do
            grep -qE "revoke all on function[^;]*from $role" \
              db/migrations/0018_evidence_session_guard.up.sql \
              || { echo "execute is not revoked from $role"; exit 1; }
          done
          grep -qE 'grant execute on function[^;]*to service_role' \
            db/migrations/0018_evidence_session_guard.up.sql

      # The immediacy above belongs to ONE endpoint. Describing it as a property
      # of Supabase tokens generally would be false everywhere else.
      - name: Immediate revocation is never claimed beyond the evidence proxy
        run: |
          if grep -rn 'requireLiveSession\|authorize_evidence_access' \
               app/netlify/functions/_shared/auth.ts; then
            echo "The dashboard auth path acquired the session check without a decision."
            exit 1
          fi
          grep -q 'dashboardTokenLifetime' app/netlify/functions/status.ts
          test -f docs/adr/0015-evidence-proxy-immediate-revocation.md

      # The operator handles the two confidential values by hand. No document
      # may tell them to put either on a command line, where it lands in shell
      # history and in the process table.
      - name: No document instructs the operator to export a credential
        run: |
          if grep -rnE '^[[:space:]]*(export|set|\$env:)[[:space:]]*(TOKEN|SECRET)[[:space:]]*=' \
               docs/ scripts/ README.md 2>/dev/null; then
            echo "A document or script assigns a credential on a command line."
            exit 1
          fi
          test -f scripts/Invoke-HostedValidation.ps1
          test -f scripts/Send-BootstrapInvitation.ps1
          # PowerShell's hidden prompt lives in the shared guard module, which is
          # the only place either script marshals a SecureString.
          grep -q 'AsSecureString' scripts/OperatorGuards.psm1
          grep -qE 'read[[:space:]]+-rs[[:space:]]+TOKEN' scripts/hosted-validation.sh

      # The application is private. Every surface sits behind the gate, and the
      # only routes a signed-out visitor may reach are the five authentication
      # ones. An invited reviewer arriving at a public dashboard is the failure
      # this milestone exists to fix.
      - name: Every surface is behind the authentication gate
        run: |
          grep -q 'RequireAuth' app/src/App.tsx
          grep -q 'PUBLIC_AUTH_ROUTES' app/src/App.tsx
          # Exactly five public routes, counted inside the exported list itself
          # rather than anywhere a quoted path happens to appear. A sixth has to
          # be argued for here.
          count=$(awk '/^export const PUBLIC_AUTH_ROUTES = \[/{f=1;next} /^\] as const/{f=0} f' \
                    app/src/App.tsx | grep -c "^  '/")
          test "$count" -eq 5 || { echo "Expected 5 public auth routes, found $count."; exit 1; }
          for route in "/login" "/auth/callback" "/auth/set-password" \
                       "/forgot-password" "/auth/reset-password"; do
            grep -q "path=\"$route\"" app/src/App.tsx \
              || { echo "Public route $route is not registered."; exit 1; }
          done
          test -f app/src/auth/RequireAuth.tsx
          test -f app/src/auth/AuthProvider.tsx

      # Invite-only, in the interface as well as in the database. Migration 0016
      # refuses an uninvited account and the project has signups disabled; a
      # registration form would still be a door with a sign on it.
      - name: The application offers no way to create an account
        run: |
          # Actual CALLS only. Both files excluded below necessarily name the
          # thing they forbid: one is the rule, the other is the comment that
          # explains why there is no such call.
          if grep -rnE '\.(signUp|signInWithOAuth|signInWithOtp|signInAnonymously)[[:space:]]*\(' \
               app/src app/netlify \
               --exclude=boundaries.test.ts --exclude=supabaseClient.ts; then
            echo "A self-registration or alternative sign-in path exists."
            exit 1
          fi

      # A credential in the URL is a credential in browser history, in the
      # referrer of the next request, and in anything the user copies out of the
      # address bar. The callback reads it once and removes it.
      - name: The invitation callback removes the credential from history
        run: |
          grep -q 'scrubCredentialFromHistory' app/src/auth/CallbackPage.tsx
          grep -q 'replaceState' app/src/auth/urlCredentials.ts
          # Nothing in the auth tree may log, and nothing may render a token.
          if grep -rn 'console\.\(log\|info\|warn\|error\|debug\)' app/src/auth; then
            echo "The authentication code logs. A token in a log line is still a disclosure."
            exit 1
          fi

      # The bootstrap invitation must reach the PREVIEW. PR #9 is unmerged, so
      # production carries none of the authentication routes, and the
      # dashboard's Invite user button can only send to the Site URL.
      - name: The bootstrap invitation names the preview callback
        run: |
          test -f scripts/Send-BootstrapInvitation.ps1
          test -f scripts/OperatorGuards.psm1
          preview='https://deploy-preview-9--haskell-fb-opportunity-radar.netlify.app/auth/callback'
          grep -qF "$preview" scripts/Send-BootstrapInvitation.ps1
          # A constant, not a parameter: a redirect that can be overridden on a
          # command line is one that will eventually be overridden back to
          # production.
          if awk '/^param\(/{f=1} f{print} /^\)/{f=0}' scripts/Send-BootstrapInvitation.ps1 \
               | grep -qiE 'redirect|callback'; then
            echo "The redirect is settable from the command line."
            exit 1
          fi
          # Both PowerShell scripts must run the SAME guards, not copies.
          for script in scripts/Invoke-HostedValidation.ps1 scripts/Send-BootstrapInvitation.ps1; do
            grep -q "OperatorGuards.psm1" "$script" \
              || { echo "$script does not import the shared guards"; exit 1; }
            if grep -qE '^function (Assert-NoObservation|Assert-CorrectCheckout|Use-Plain|Read-SecretValue)' "$script"; then
              echo "$script redefines a shared guard; it would drift from the other."
              exit 1
            fi
          done

      # Windows PowerShell 5.1 reads a BOM-less .ps1/.psm1 as Windows-1252, so a
      # single em dash ends a string the parser never sees closed and the whole
      # file stops parsing. Checked here as well as on the Windows runner
      # because it is cheap, runs on every push, and names the offending byte.
      - name: Operator scripts are ASCII only
        run: |
          bad=0
          for f in scripts/*.ps1 scripts/*.psm1 scripts/*.sh; do
            if LC_ALL=C grep -nP '[\x80-\xFF]' "$f"; then
              echo "$f contains a byte above 0x7F; Windows PowerShell 5.1 would misread it."
              bad=1
            fi
          done
          test "$bad" -eq 0
          # A BOM would also make 5.1 read UTF-8, but ASCII needs none and a BOM
          # is one stripped byte away from being useless.
          for f in scripts/*.ps1 scripts/*.psm1; do
            head -c 3 "$f" | LC_ALL=C grep -q $'\xef\xbb\xbf' && { echo "$f has a BOM"; exit 1; }
          done
          echo "all operator scripts are pure ASCII"

      - name: Netlify configuration is present and points at the app
        run: |
          grep -q 'base = "app"' netlify.toml
          grep -q 'publish = "dist"' netlify.toml
          grep -q 'status = 200' netlify.toml
          test -f app/public/_redirects

  windows-operator-scripts:
    name: Operator scripts (Windows PowerShell 5.1)
    runs-on: windows-latest

    # WHY THIS JOB EXISTS.
    #
    # The operator runs these on Windows, and Windows PowerShell 5.1 reads a
    # BOM-less .ps1 or .psm1 as Windows-1252, NOT UTF-8. An em dash is E2 80 94
    # in UTF-8, which cp1252 decodes as three characters ending in a curly
    # double quote -- and that quote opens a string the parser never sees
    # closed. The result is `a-euro-quote` on screen followed by
    # unexpected-token, unterminated-string and missing-brace errors dozens of
    # lines from the actual character.
    #
    # Parsing with PowerShell 7 on Linux CANNOT catch this: 7 assumes UTF-8, so
    # the file parses perfectly there and fails on the operator's machine. The
    # claim "works on Windows PowerShell 5.1" is only true if 5.1 says so, which
    # is what this job is for.
    #
    # `shell: powershell` is Windows PowerShell 5.1. `shell: pwsh` would be
    # PowerShell 7 and would defeat the point.

    steps:
      # LF in the working tree. Git for Windows would otherwise rewrite line
      # endings on checkout, which shows up as a dirty tree and would make the
      # refusal tests below pass or fail for the wrong reason.
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # A named branch, not a detached merge commit: the scripts check the
          # branch and compare HEAD against the freshly fetched remote head, so
          # they need a real one to check.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Report the interpreter, so the evidence names itself
        shell: powershell
        run: |
          $PSVersionTable | Format-List | Out-String | Write-Host
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            Write-Host "This job must run on Windows PowerShell (Desktop edition), not PowerShell 7."
            exit 1
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "Expected PowerShell 5.x, got $($PSVersionTable.PSVersion)."
            exit 1
          }

      - name: Every operator PowerShell file parses under 5.1
        shell: powershell
        run: |
          $files = @(
            'scripts\OperatorGuards.psm1',
            'scripts\Send-BootstrapInvitation.ps1',
            'scripts\Invoke-HostedValidation.ps1'
          )
          $failed = 0
          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref] $null, [ref] $errors)
            if ($errors) {
              $failed++
              Write-Host "FAIL  $file"
              foreach ($e in $errors) {
                Write-Host ("        line {0}: {1}" -f $e.Extent.StartLineNumber, $e.Message)
              }
            } else {
              Write-Host "ok    $file"
            }
          }
          if ($failed -gt 0) { exit 1 }

      - name: The module actually imports, and exports what the scripts call
        shell: powershell
        run: |
          Import-Module .\scripts\OperatorGuards.psm1 -Force
          $expected = 'Assert-NoObservation','Assert-CorrectCheckout',
                      'Invoke-OperatorGit','Read-SecretValue','Use-Plain'
          foreach ($name in $expected) {
            if (-not (Get-Command $name -ErrorAction SilentlyContinue)) {
              Write-Host "FAIL  $name is not exported"
              exit 1
            }
            Write-Host "ok    $name"
          }

      - name: Operator PowerShell sources are ASCII only
        shell: powershell
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem scripts -Include *.ps1,*.psm1 -Recurse) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $bad = @($bytes | Where-Object { $_ -gt 127 })
            if ($bad.Count -gt 0) {
              $failed++
              Write-Host "FAIL  $($file.Name) has $($bad.Count) byte(s) above 0x7F"
            } else {
              Write-Host "ok    $($file.Name) ($($bytes.Length) bytes, all ASCII)"
            }
          }
          if ($failed -gt 0) { exit 1 }

      # The guards, exercised as refusals rather than asserted from source. Each
      # case must abort with its OWN message: a script that refused everything
      # for one reason would pass a weaker version of this test.
      - name: Refusal - a repository that is not this one
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\Send-BootstrapInvitation.ps1 -Repository 'someone/else' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'must not run against another repository') {
            Write-Host 'FAIL: wrong-repository refusal did not fire'; exit 1
          }
          if ($out -match 'email address to invite') {
            Write-Host 'FAIL: it prompted before refusing'; exit 1
          }

      - name: Refusal - the wrong branch
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\Send-BootstrapInvitation.ps1 -Branch 'not-the-pr-branch' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "expected 'not-the-pr-branch'") {
            Write-Host 'FAIL: wrong-branch refusal did not fire'; exit 1
          }

      - name: Refusal - a dirty working tree
        shell: powershell
        run: |
          Set-Content -Path .\ci-dirty-tree-probe.txt -Value 'untracked' -Encoding Ascii
          try {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass `
              -File .\scripts\Send-BootstrapInvitation.ps1 2>&1 | Out-String
          } finally {
            Remove-Item .\ci-dirty-tree-probe.txt -Force -ErrorAction SilentlyContinue
          }
          Write-Host $out
          if ($out -notmatch 'working tree is not clean') {
            Write-Host 'FAIL: dirty-tree refusal did not fire'; exit 1
          }

      - name: Refusal - verbose output, before anything else
        shell: powershell
        run: |
          # Verbose is refused by Assert-NoObservation, which runs BEFORE the
          # repository guard -- so this must abort without a single PASS line.
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -Command `
            "`$VerbosePreference='Continue'; & .\scripts\Send-BootstrapInvitation.ps1" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Refusing to run with verbose output enabled') {
            Write-Host 'FAIL: verbose refusal did not fire'; exit 1
          }
          if ($out -match 'PASS  origin is') {
            Write-Host 'FAIL: it reached the repository guard before refusing'; exit 1
          }

      - name: Refusal - debug output
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -Command `
            "`$DebugPreference='Continue'; & .\scripts\Send-BootstrapInvitation.ps1" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Refusing to run with debug output enabled') {
            Write-Host 'FAIL: debug refusal did not fire'; exit 1
          }

      - name: Refusal - script tracing
        shell: powershell
        run: |
          # Set-PSDebug -Trace expands and prints every line as it runs, headers
          # included. The guard cannot read the trace level, so it switches
          # tracing off before anything sensitive happens; this proves the
          # script still completes its refusal rather than dying under a trace.
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -Command `
            "Set-PSDebug -Trace 2; & .\scripts\Send-BootstrapInvitation.ps1 -Repository 'someone/else'" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'must not run against another repository') {
            Write-Host 'FAIL: the script did not survive tracing to reach its refusal'; exit 1
          }

      - name: Refusal - the reserved SEC mailbox
        shell: powershell
        run: |
          # This one runs the FULL repository guard first, so it also proves the
          # guards pass on a correct checkout. The address is refused before the
          # secret is requested, so nothing is sent and no key is involved.
          # The branch is read from the checkout rather than assumed, so this
          # step is about the ADDRESS. The wrong-branch refusal has its own step
          # above; here the repository guard is expected to pass.
          $branch = (git rev-parse --abbrev-ref HEAD).Trim()
          # `cmd /c` to feed stdin: PowerShell has no input-redirection operator,
          # and this is the reliable way to give powershell.exe a line to read.
          $out = cmd /c "echo oracles@openi-analytics.com | powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Send-BootstrapInvitation.ps1 -Branch $branch 2>&1" | Out-String
          Write-Host $out
          if ($out -notmatch 'PASS  working tree is clean') {
            Write-Host 'FAIL: the repository guard did not pass on a correct checkout'; exit 1
          }
          if ($out -notmatch 'reserved for SEC') {
            Write-Host 'FAIL: reserved-address refusal did not fire'; exit 1
          }
          if ($out -match 'Supabase secret key') {
            Write-Host 'FAIL: it asked for the key before refusing the address'; exit 1
          }
          if ($out -notmatch 'No invitation was sent') {
            Write-Host 'FAIL: it did not report that nothing was sent'; exit 1
          }

      - name: The hosted validator refuses on the same guards
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\Invoke-HostedValidation.ps1 -Repository 'someone/else' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'must not run against another repository') {
            Write-Host 'FAIL: the validator did not refuse'; exit 1
          }

  database:
    name: Migration checks (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest

    # 16 AND 17. Supabase provisions 17 for new projects, so 17 is the version
    # the migrations will actually meet; 16 stays in the matrix because the
    # schema was authored and reviewed against it and a silent divergence
    # between the two is exactly what this leg is here to catch.
    #
    # fail-fast is off: when one version breaks, the other version's result is
    # the most useful diagnostic available, and cancelling it throws that away.
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']

    # No Supabase project is contacted and no production credential is required:
    # the service container is created, migrated, tested and destroyed inside
    # the job.
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: radar
      PGPASSWORD: radar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The migration harness shells out to psql, so the client has to match the
      # server major version. The runner image ships an older client by default.
      - name: Install the PostgreSQL ${{ matrix.pg }} client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"

      # Verified, not assumed. The design package explicitly refuses to assume a
      # PostgreSQL major version, and pgcrypto is a hard dependency of the
      # baseline schema's `gen_random_uuid()` defaults.
      #
      # The server major is asserted against the matrix leg. Without this, a
      # mis-tagged image would let one version's result be reported under the
      # other version's name — the matrix would look green and prove nothing.
      - name: Verify the server version and pgcrypto availability
        run: |
          psql -d postgres -tAc 'select version();'
          server_major=$(psql -d postgres -tAc 'show server_version;' | cut -d. -f1)
          if [ "$server_major" != "${{ matrix.pg }}" ]; then
            echo "Expected PostgreSQL ${{ matrix.pg }}, the server reports $server_major."
            exit 1
          fi
          client_major=$(psql --version | grep -oE '[0-9]+' | head -1)
          if [ "$client_major" != "${{ matrix.pg }}" ]; then
            echo "psql client is $client_major, expected ${{ matrix.pg }}."
            exit 1
          fi
          psql -d postgres -tAc "select 1 from pg_available_extensions where name = 'pgcrypto';" \
            | grep -q 1 || { echo 'pgcrypto is not available on this server.'; exit 1; }

      # Empty -> forward -> rollback; v0.1.0 -> forward -> rollback to baseline,
      # compared dump for dump; positive and negative schema-contract tests; and
      # a deliberate migration edit that must be caught by checksum verification.
      - name: Migration contract
        run: bash db/verify.sh
