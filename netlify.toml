# Netlify configuration — Haskell F&B Opportunity Radar
#
# The Production Foundation gives the application a backend, so `connect-src`
# changes from `'none'` to a narrow, project-specific allowlist. It is generated
# at build time by `app/scripts/generate-headers.mjs` into `dist/_headers`,
# because the one external origin the browser may address is THIS deployment's
# Supabase project, and that differs between development, preview and
# production. A policy written statically here could only be permissive enough
# to cover all three, which is the opposite of a narrow allowlist.
#
# With no VITE_SUPABASE_URL configured the generated policy is
# `connect-src 'self'` — same-origin functions only. Fail closed, not open.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

# Non-secret configuration, committed deliberately.
#
# Everything here is either already public — the project URL appears in every
# request the browser makes — or operational configuration that is safer
# reviewed in a pull request than typed into a dashboard. Nothing below is a
# credential.
#
# The two Supabase KEYS and MODEL_API_KEY are NOT here and must be entered in
# the Netlify UI. docs/ENVIRONMENT.md gives the exact location and scope.
[build.environment]
  NODE_VERSION = "22"
  # Chromium is only needed for the local screenshot script, never for the build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

  # Client-safe. Read at BUILD time by Vite, and by scripts/generate-headers.mjs
  # which turns it into the CSP connect-src allowlist.
  VITE_SUPABASE_URL = "https://dutmdlbangsthclgtkhy.supabase.co"
  VITE_RADAR_ENV = "development"

  # VITE_AUTH_MICROSOFT_ENABLED IS DELIBERATELY NOT DECLARED HERE.
  #
  # It is set per CONTEXT, further down, and this absence is the point.
  #
  # A value in `[build.environment]` applies to every context, and netlify.toml
  # OVERRIDES anything set in the Netlify UI or API. So a global "false" here
  # could not be turned on for deploy previews from the dashboard: the UI value
  # would be silently ignored and the preview would build with the button off,
  # with nothing anywhere saying why. That is the failure this layout removes.
  #
  # Not a secret, and not a security control: it decides whether a button is
  # rendered, and every authorization rule holds identically either way. What it
  # prevents is a deployment offering a door that opens onto an error, because
  # Microsoft sign-in only works where an Entra application registration exists
  # and its credentials have been entered into that Supabase project.
  #
  # Read at BUILD time by Vite, so changing a context requires a rebuild of that
  # context. See docs/MICROSOFT_ENTRA_SETUP.md.
  #
  # The Entra client ID, tenant ID and client secret are NOT here and never will
  # be. They belong to the Supabase project; the browser never sees them.

  # ---------------------------------------------------------------------
  # NOTHING BELOW THIS LINE, BECAUSE FUNCTIONS CANNOT READ THIS FILE.
  # ---------------------------------------------------------------------
  #
  # This block used to also declare SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
  # SUPABASE_EVIDENCE_BUCKET, RADAR_ENV, EGRESS_ALLOWLIST,
  # SEC_EDGAR_USER_AGENT, SEC_CONTACT_CONFIRMED and the three MODEL_*
  # variables, under a comment claiming "the functions runtime inherits
  # these". IT DOES NOT. Netlify's documentation is explicit: environment
  # variables declared in a configuration file are available to the BUILD and
  # are NOT available to serverless functions.
  #
  #   https://docs.netlify.com/build/functions/environment-variables/
  #
  # So those declarations could never have worked, and were worse than
  # useless: they read as configuration while supplying nothing, so a missing
  # Functions-scoped variable looked like it was already set. They have been
  # removed rather than corrected in place, because there is no way to make a
  # configuration file supply a function value.
  #
  # Removing them changes no runtime behaviour. A function never received
  # them. `env.ts` reads `process.env[name]` with a COMPUTED key, which no
  # bundler can inline even in principle, so there was never a path by which
  # a build-time value reached a deployed function.
  #
  # Every one of those variables now lives in the Netlify UI with the
  # **Functions** scope, per context. `docs/ENVIRONMENT.md` lists each with
  # its scope, contexts and secret status, and
  # `app/src/test/runtimeConfiguration.test.ts` fails if any of them
  # reappears here.
  #
  # WHAT MAY LIVE HERE: values Vite compiles into the bundle (VITE_*), and
  # values the build process itself reads. Nothing else.

# EVERY CONTEXT STATES THE MICROSOFT FLAG EXPLICITLY.
#
# Three declarations rather than one default plus an exception, because an
# exception is invisible: reading `[context.production.environment]` and finding
# nothing tells you the flag is off ONLY if you also know what the global block
# says and how Netlify merges the two. Stating it three times means each context
# can be read on its own and be right.
#
# `app/src/test/microsoftFlagContexts.test.ts` holds this shape: it fails if the
# flag reappears in `[build.environment]`, if any context stops declaring it, or
# if a context resolves to the wrong value.
#
# A context not listed here (a named branch context, `netlify dev`, or a plain
# `vite build` on a laptop) leaves the variable UNSET, and unset is disabled --
# `microsoftFlagEnabled` requires the exact string "true". Off is what you get
# by default, everywhere, without anybody writing it down.

[context.production.environment]
  VITE_RADAR_ENV = "production"
  # ON. Microsoft sign-in was hosted-tested on the PR 13 deploy preview with an
  # existing allowlisted Openi account: the identity linked to the EXISTING
  # Supabase user, no duplicate was created, and password sign-in and recovery
  # by code both still worked afterwards.
  #
  # A Haskell account was not available to test before release, so Haskell
  # tenant consent and Haskell first-login identity linking are PENDING
  # OPERATIONAL VALIDATION in production. See docs/MICROSOFT_ENTRA_SETUP.md.
  # If Haskell's tenant refuses, the fix is on Microsoft's side or is this flag
  # going back to "false" -- never a relaxed authorization control here.
  VITE_AUTH_MICROSOFT_ENABLED = "true"

[context.deploy-preview.environment]
  VITE_RADAR_ENV = "preview"
  # ON for pull-request previews, which is where Microsoft sign-in is tested
  # before production is asked to carry it.
  VITE_AUTH_MICROSOFT_ENABLED = "true"

[context.branch-deploy.environment]
  VITE_RADAR_ENV = "preview"
  # A branch deploy is not a reviewed pull request. It gets the preview
  # environment but NOT the Microsoft button.
  VITE_AUTH_MICROSOFT_ENABLED = "false"

# The API. Same-origin by construction: the browser only ever addresses this
# origin, so `connect-src` needs to permit exactly two things — 'self' and the
# Supabase project.
#
# `scheduled-ingest` is deliberately absent. A scheduled function has no HTTP
# route; giving it one would create the public invocation path the design
# forbids, and the authenticated `admin-run` exists precisely so nobody needs to.
[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/admin-run"
  to = "/.netlify/functions/admin-run"
  status = 200

# "Is this session still allowed to be here?" — the one bit the browser cannot
# answer for itself, because `auth_invite_allowlist` is unreadable by a signed-in
# session on purpose. Called whenever a session is established, so removing
# someone takes effect on their next page load rather than at token expiry.
[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

# The authenticated evidence proxy. Confidential evidence is never served by a
# signed Storage URL: a signed URL is a bearer credential that survives removal
# from the allowlist until it expires, and an already-cached response survives
# even that. This endpoint re-authorises every request instead.
[[redirects]]
  from = "/api/evidence/*"
  to = "/.netlify/functions/evidence/:splat"
  status = 200

# Anything else under /api is not a route. Without this, an unmatched /api path
# falls through to the SPA rule below and returns index.html with a 200, so a
# typo in a client call looks like a successful request that returned HTML.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# SPA fallback, LAST, and this file is the ONLY place redirects are declared.
#
# THIS RULE ONCE EXISTED IN TWO PLACES AND THAT WAS AN OUTAGE.
#
# `app/public/_redirects` used to carry a copy of this catch-all, "so the
# behaviour survives if this file is ever replaced by UI-configured settings".
# The reasoning inverted the thing it was trying to protect: Netlify processes
# a `_redirects` FILE BEFORE the rules in `netlify.toml`. A copy of the LAST
# rule, placed in the file that is read FIRST, becomes the first rule.
#
# So `/*  /index.html  200` matched `/api/session` before any of the API rules
# above were consulted. Netlify answered 200 with index.html, the SPA booted at
# `/api/session`, `confirmStanding()` got HTML where it expected JSON, and the
# gate reported a service failure. Every `/api/*` route was dead in every
# deployment, and nothing in this file was wrong -- which is why reading it
# found nothing.
#
# There is now one source of truth. `app/src/test/netlifyRouting.test.ts`
# resolves every API path the client actually calls through Netlify's real
# precedence rules and fails the build if any of them reaches index.html, and a
# boundary step fails the build if a `_redirects` file reappears without the
# API rules ordered ahead of a catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # An authenticated pilot dashboard must never be indexed.
    X-Robots-Tag = "noindex, nofollow, noarchive"
    # Content-Security-Policy is NOT set here. It is generated per-deployment
    # into dist/_headers so it can name the exact Supabase origin.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  # Relative to `base = "app"`.
  directory = "netlify/functions"
  node_bundler = "esbuild"
