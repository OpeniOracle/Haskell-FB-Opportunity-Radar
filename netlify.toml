# Netlify configuration — Haskell F&B Opportunity Radar
#
# The Production Foundation gives the application a backend, so `connect-src`
# changes from `'none'` to a narrow, project-specific allowlist. It is generated
# at build time by `app/scripts/generate-headers.mjs` into `dist/_headers`,
# because the one external origin the browser may address is THIS deployment's
# Supabase project, and that differs between development, preview and
# production. A policy written statically here could only be permissive enough
# to cover all three, which is the opposite of a narrow allowlist.
#
# With no VITE_SUPABASE_URL configured the generated policy is
# `connect-src 'self'` — same-origin functions only. Fail closed, not open.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

# Non-secret configuration, committed deliberately.
#
# Everything here is either already public — the project URL appears in every
# request the browser makes — or operational configuration that is safer
# reviewed in a pull request than typed into a dashboard. Nothing below is a
# credential.
#
# The two Supabase KEYS and MODEL_API_KEY are NOT here and must be entered in
# the Netlify UI. docs/ENVIRONMENT.md gives the exact location and scope.
[build.environment]
  NODE_VERSION = "22"
  # Chromium is only needed for the local screenshot script, never for the build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

  # Client-safe. Read at BUILD time by Vite, and by scripts/generate-headers.mjs
  # which turns it into the CSP connect-src allowlist.
  VITE_SUPABASE_URL = "https://dutmdlbangsthclgtkhy.supabase.co"
  VITE_RADAR_ENV = "development"

  # Server-side, non-secret. The functions runtime inherits these.
  SUPABASE_URL = "https://dutmdlbangsthclgtkhy.supabase.co"
  SUPABASE_EVIDENCE_BUCKET = "evidence-raw"
  RADAR_ENV = "development"

  # The single egress gateway's allowlist. An entry permits the host and its
  # subdomains and nothing else. Corporate newsroom hosts are added as each
  # connector is verified — the coverage matrix records them as Unverified, and
  # allowlisting a host we have never successfully fetched would assert a
  # verification that has not happened.
  EGRESS_ALLOWLIST = "sec.gov,data.sec.gov,www.sec.gov,fsis.usda.gov,www.fsis.usda.gov"

  # SEC requires a declared User-Agent carrying an address a human monitors.
  # oracles@openi-analytics.com is retained pending confirmation of an actively
  # monitored address. `assertSecUserAgentUsable` refuses to start a collection
  # run if an unresolved <PLACEHOLDER> is ever substituted here, because sending
  # one would be a false contact declaration to a federal regulator.
  SEC_EDGAR_USER_AGENT = "Openi Analytics Haskell F&B Radar oracles@openi-analytics.com"

  # Anthropic Direct, through the provider-neutral gateway. MODEL_ID stays
  # configurable; claude-sonnet-5 is the current stable Sonnet.
  MODEL_PROVIDER = "anthropic"
  MODEL_ID = "claude-sonnet-5"
  MODEL_PROMPT_VERSION = "v0"

[context.production.environment]
  VITE_RADAR_ENV = "production"
  RADAR_ENV = "production"

[context.deploy-preview.environment]
  VITE_RADAR_ENV = "preview"
  RADAR_ENV = "preview"

[context.branch-deploy.environment]
  VITE_RADAR_ENV = "preview"
  RADAR_ENV = "preview"

# The API. Same-origin by construction: the browser only ever addresses this
# origin, so `connect-src` needs to permit exactly two things — 'self' and the
# Supabase project.
#
# `scheduled-ingest` is deliberately absent. A scheduled function has no HTTP
# route; giving it one would create the public invocation path the design
# forbids, and the authenticated `admin-run` exists precisely so nobody needs to.
[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/admin-run"
  to = "/.netlify/functions/admin-run"
  status = 200

# Anything else under /api is not a route. Without this, an unmatched /api path
# falls through to the SPA rule below and returns index.html with a 200, so a
# typo in a client call looks like a successful request that returned HTML.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# SPA fallback, last. Duplicated in app/public/_redirects so the behaviour
# survives if this file is ever replaced by UI-configured settings.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # An authenticated pilot dashboard must never be indexed.
    X-Robots-Tag = "noindex, nofollow, noarchive"
    # Content-Security-Policy is NOT set here. It is generated per-deployment
    # into dist/_headers so it can name the exact Supabase origin.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  # Relative to `base = "app"`.
  directory = "netlify/functions"
  node_bundler = "esbuild"
